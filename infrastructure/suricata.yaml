%YAML 1.1
---
# Network Configuration
vars:
  address-groups:
    HOME_NET: "[172.19.0.0/16, 172.20.0.0/16, 172.18.0.0/16]"
    EXTERNAL_NET: "any"

# Output Configuration (The Interface to Role B)
outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            payload: yes             # Useful for Deep Packet Inspection (DPI)
            payload-buffer-size: 4kb
            payload-printable: yes
            packet: yes
            http-body: yes
        - flow:
            enabled: yes             # CRITICAL: This generates the data for the ML model
            include-flow-uuid: yes
        - icmp:           
            enabled: yes
        - http:
            enabled: yes
            extended: yes
        - dns:
            enabled: yes
        - tls:
            enabled: yes
            extended: yes

# Flow Settings (Tuning for Real-time Response)
flow:
  memcap: 128mb
  hash-size: 65536
  prealloc: 10000
  emergency-recovery: 30

# Flow Timeouts (Reducing latency for ML ingestion)
# Standard timeouts (e.g., 600s) delay ML detection. We reduce them for the project.
flow-timeouts:
  default:
    new: 5            # Scade de la 30
    established: 10   # Scade de la 120
    closed: 0
  icmp:               # Adaugă secțiune specifică pentru Ping
    new: 2
    established: 5
    
    # Rule Configuration
default-rule-path: /var/lib/suricata/rules
rule-files:
  - suricata.rules

# Capture Settings (Telling Suricata how to listen)
af-packet:
  - interface: br-proiect
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes

stream:
  memcap: 64mb
  checksum-validation: no      # CRITIC: Docker generează adesea checksums "greșite"
  inline: auto